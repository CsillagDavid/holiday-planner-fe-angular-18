<div id="map"></div>
<div class="sidenav-container" [ngClass]="[sidenavOpened ? 'opened': 'closed']">
    <mat-tree [dataSource]="dataSource" [treeControl]="treeControl">
        <!-- This is the tree node template for leaf nodes -->
        <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
            <!-- use a disabled button to provide padding for tree leaf -->
            <!-- <button matIconButton disabled></button> -->
            {{node.name}}
        </mat-tree-node>
        <!-- This is the tree node template for expandable nodes -->
        <mat-tree-node class="" *matTreeNodeDef="let node;when: hasChild" matTreeNodePadding matTreeNodeToggle class="expandable-mat-tree-node"
            [cdkTreeNodeTypeaheadLabel]="node.name">
            <span class="group-expander">
                <mat-icon class="mat-icon-rtl-mirror">
                    {{treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
                </mat-icon>
            </span>
            {{node.name}}
        </mat-tree-node>
    </mat-tree>
</div>
@if (!isSideNavHidden) {
    <div class="sidenav-button-container" [ngClass]="[sidenavOpened ? 'opened': 'closed']" (click)="onSidenavButtonClicked()">
    @if(sidenavOpened) {
    <span><mat-icon>keyboard_arrow_right</mat-icon></span>
    }
    @else {
    <span><mat-icon>keyboard_arrow_left</mat-icon></span>
    }
</div>
}
